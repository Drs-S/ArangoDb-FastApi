services:
  arangodb:
    image: arangodb:3.12
    container_name: arangodb
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps:/var/lib/arangodb3-apps
      - ./data:/import:ro # jeu de données à importer avec arangoimport
    healthcheck:
      test: ["CMD-SHELL", "arangosh --server.password \"$$ARANGO_ROOT_PASSWORD\" --javascript.execute-string 'db._version()' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # API FastAPI : docker compose --profile api up -d --build
  api:
    profiles: ["api"]
    build: ./api
    container_name: arangodb-fastapi
    environment:
      ARANGO_HOST: http://arangodb:8529
      ARANGO_DB: demo
      ARANGO_USER: root
      ARANGO_PASSWORD: ${ARANGO_ROOT_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      arangodb:
        condition: service_healthy

volumes:
  arangodb_data:
  arangodb_apps:
